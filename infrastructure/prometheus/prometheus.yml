global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "kestrel-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "kestrel-stream-processor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["stream-processor:8001"]
